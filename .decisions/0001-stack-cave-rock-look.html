<title>Stack Cave Rock</title>
<style>
:root{--bg:#0b0d11;--panel:#10141a;--lane:#12161c;--surface:#191e26;--surface2:#1e242d;--raised:#1b2029;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.12);--text:#e7eaf0;--muted:#a2aab7;--faint:#6c7584;--accent:#8ea8ff;--accent-ink:#0d1530;--accent-bg:rgba(142,168,255,.14);--good:#5fd3ae;--good-bg:rgba(95,211,174,.13);--warn:#f3b955;--warn-bg:rgba(243,185,85,.13);--bad:#f2727a;--bad-bg:rgba(242,114,122,.13);--chosen:#5fd3ae;--hist:#8792ad;--radius:10px;--font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace;--good-fill:#5fd3ae;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
main{max-width:1240px;margin:0 auto;padding:18px 18px 48px}
h1{font-size:21px;font-weight:600;margin:4px 0 8px;line-height:1.3}
h2{font-size:14px;font-weight:600;margin:26px 0 10px;color:var(--text);letter-spacing:.1px}
h3{font-size:14.5px;font-weight:600;margin:0}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.open{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.decided{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.found{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.superseded,.chip.rejected{text-decoration:line-through}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.btn{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer}
.btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.18)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
input,textarea{font:inherit;width:100%;max-width:100%;padding:8px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--faint)}
svg{max-width:100%}

.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.brand .mark{width:28px;height:28px;flex:none}
.brand b{font-size:17px;letter-spacing:.2px}

.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.opt{display:flex;flex-direction:column;gap:10px}
.opt.is-rec{border-color:var(--warn)}
.opt.is-chosen{border-color:var(--chosen);box-shadow:inset 0 0 0 1px var(--chosen)}
.opt.is-dim{opacity:.62}
.letter{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--surface2);font-weight:600;font-size:13px;flex:none}
.sketch{background:var(--surface2);border-radius:8px;padding:8px;color:var(--text);aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
.sketch svg{width:100%;height:100%;display:block}
.pc{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.pc li{display:flex;gap:6px;align-items:flex-start}
.pc .icon{margin-top:2px}
.pro .icon{color:var(--good)}
.con .icon{color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.badge.rec{background:var(--warn-bg);color:var(--warn)}
.badge.ch{background:var(--good-bg);color:var(--good)}
.crit{display:grid;gap:10px}
.crit-row{display:grid;gap:6px}
.crit-name{font-weight:600;font-size:14px}
.crit-opts{display:flex;flex-wrap:wrap;gap:6px 14px}
.score{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pips{display:inline-flex;gap:3px}
.pip{width:10px;height:10px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--accent)}
.score.is-chosen .pip.on{background:var(--chosen)}
.note{font-size:13px;color:var(--muted)}
.pick-opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.pick-opts .btn[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.callout{border-left:3px solid var(--warn);padding:10px 14px;background:var(--surface);border-radius:0}
.callout.good{border-left-color:var(--chosen)}
.callout.bad{border-left-color:var(--bad)}
.toast{font-size:13px;color:var(--good);min-height:1.4em;margin-top:8px}
.err{font-size:13px;color:var(--bad);min-height:1.2em}
.sub{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 0}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13.5px}
.mini li{display:flex;gap:6px;align-items:flex-start}
.mini .icon{width:14px;height:14px;margin-top:3px;color:var(--muted)}
.mini.risk .icon{color:var(--warn)}
.est{display:grid;gap:2px;font-size:13.5px}
.est .basis{font-size:12.5px;color:var(--muted)}
.ev{display:grid;gap:10px}
.ev-item{display:grid;gap:4px}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.ev-meta a{display:inline-flex;gap:4px;align-items:center}
.code{font-family:var(--mono);font-size:13px;word-break:break-all;background:var(--surface2);padding:1px 6px;border-radius:5px}
.brief{display:grid;gap:14px}
.brief ol{margin:0;padding-left:20px;display:grid;gap:4px}
.reads{display:grid;gap:8px;margin:4px 0 12px}
.read{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.read .icon{margin-top:2px}
.ok-read .icon{color:var(--good)}
.warn-read{border-color:var(--warn)}.warn-read .icon{color:var(--warn)}
.bad-read{border-color:var(--bad)}.bad-read .icon{color:var(--bad)}
.ruled{margin-top:12px}
.deep-chip{background:var(--accent-bg);color:var(--accent);border-color:transparent}
</style>
</head>

<script id="data" type="application/json">{"id":1,"slug":"stack-cave-rock-look","title":"How should the stack's mouth room get rock that reads as stone?","date":"2026-11-02","mode":"quick","deep":true,"lenses":["ui","architecture"],"status":"decided","context":"F19's mouth room was passed for now, with its polish left for later: the walls read as smoke, the floor as rolling dunes, and the rubble as flat outlined shapes. The cause is in the code. The walls get only two soft noise octaves and a faint shader bump, with no texture. The floor is one smooth noise octave. The rubble stones are faceted balls with flat colour and an outline, and they get no shadow or occlusion. The way this is fixed sets how the spring cave and the Hollow's rooms will look too, since they share the same field and shader.","depends_on":[],"conflicts":[],"options":[{"key":"A","name":"Detail in the shader only","summary":"Keep the room's shape as it is. Paint the cliffs' photographed rock onto it with triplanar mapping (albedo and normal), add a baked crease darkening and a wet sheen near the floor, and rebuild the rubble's shading.","sketch":"\u003csvg viewBox='0 0 320 180' xmlns='http://www.w3.org/2000/svg'>\u003crect x='0' y='0' width='320' height='180' fill='none'/>\u003cpath d='M20 30 C 70 20, 90 70, 130 60 S 200 30, 230 70 S 290 90, 300 80 L300 150 L20 150 Z' fill='var(--muted)' opacity='0.35'/>\u003cpath d='M20 30 C 70 20, 90 70, 130 60 S 200 30, 230 70 S 290 90, 300 80' fill='none' stroke='currentColor' stroke-width='3'/>\u003cg fill='var(--accent)'>\u003ccircle cx='40' cy='40' r='2.5'/>\u003ccircle cx='62' cy='34' r='2.5'/>\u003ccircle cx='95' cy='55' r='2.5'/>\u003ccircle cx='120' cy='66' r='2.5'/>\u003ccircle cx='150' cy='54' r='2.5'/>\u003ccircle cx='180' cy='42' r='2.5'/>\u003ccircle cx='210' cy='50' r='2.5'/>\u003ccircle cx='240' cy='76' r='2.5'/>\u003ccircle cx='270' cy='86' r='2.5'/>\u003ccircle cx='292' cy='84' r='2.5'/>\u003c/g>\u003ctext x='20' y='172' font-size='13' fill='currentColor'>shape stays smooth\u003c/text>\u003ctext x='190' y='20' font-size='13' fill='currentColor'>texture on top\u003c/text>\u003c/svg>","pros":["The smallest change: no new mesh, no change to walking or to the baked lantern light.","The rock matches the cliff outside, since it uses the same photographed texture and the same palette scaling as the pieces pass.","Cheap at run time: about six texture reads a pixel for albedo and normal."],"cons":["The outlines stay blobby. Shader detail never changes silhouettes or shadows, and the smoke read comes mostly from the soft shapes.","The floor still rolls like dunes. A texture on a dune is a textured dune.","Triplanar blending can show smears on diagonal faces."],"effort":"About 2 to 3 days of code.","source":"claude","assumptions":["The cliffs' rock scan reads well up close at 1 to 3 m, as it does on the cave mouth's outside.","Crease darkening can be baked from the field into the vertex colour beside the lantern's baked sight."],"risks":["It looks better but still soft, and a second polish pass is needed later anyway.","Photo colour fights the palette rule unless it is scaled by the scan's mean, as the pieces pass already does."],"estimates":[{"what":"Code","value":"2 to 3 days","basis":"triplanar scan port from piece-draw.wgsl (1 day), baked creases (half a day), rubble shading and wet floor (1 day)"},{"what":"Frame cost","value":"about 6 extra texture reads a pixel","basis":"3 projections for albedo and 3 for normal"}]},{"key":"B","name":"Stone forms in the field, texture on top","summary":"Give the room's field stone shapes at the current mesh size: flat bedding ledges and floor slabs (terraced), faceted boulder bulges (a stacked-rocks layer that keeps the field a true distance), shallow joint grooves, and a rougher ceiling. Then add the cliffs' triplanar rock texture for the fine grain, and rebuild the rubble as real stones that take the lantern's shadow and the scan, with no outline.","sketch":"\u003csvg viewBox='0 0 320 180' xmlns='http://www.w3.org/2000/svg'>\u003crect x='0' y='0' width='320' height='180' fill='none'/>\u003cpath d='M20 28 L60 28 L66 44 L110 44 L114 60 L150 56 L160 38 L200 38 L206 62 L250 66 L256 82 L300 82 L300 150 L20 150 Z' fill='var(--muted)' opacity='0.35'/>\u003cpath d='M20 28 L60 28 L66 44 L110 44 L114 60 L150 56 L160 38 L200 38 L206 62 L250 66 L256 82 L300 82' fill='none' stroke='currentColor' stroke-width='3'/>\u003cpath d='M40 100 L70 100 M90 112 L140 112 M180 104 L230 104' stroke='currentColor' stroke-width='2' opacity='0.6'/>\u003cg fill='var(--accent)'>\u003ccircle cx='40' cy='34' r='2.5'/>\u003ccircle cx='88' cy='50' r='2.5'/>\u003ccircle cx='132' cy='62' r='2.5'/>\u003ccircle cx='180' cy='44' r='2.5'/>\u003ccircle cx='228' cy='70' r='2.5'/>\u003ccircle cx='280' cy='88' r='2.5'/>\u003c/g>\u003ctext x='20' y='172' font-size='13' fill='currentColor'>ledges and slabs in the shape\u003c/text>\u003ctext x='200' y='20' font-size='13' fill='currentColor'>texture on top\u003c/text>\u003c/svg>","pros":["Fixes all three problems at their cause: the walls get ledges and edges, the floor gets slabs and sand pockets, and the rubble becomes stones.","The rubble joins the lantern's light: it casts and takes shadow and loses the cartoon outline.","The same field helpers serve the spring cave and the Hollow's rooms later, so the work pays back.","No new art from you: it is all procedural, tuned through recipes/world/stack-mouth.json."],"cons":["Edges stay a little rounded at the 12 cm mesh size. Truly crisp cracks need a finer mesh or a different mesher, which this option does not include.","A richer field costs more to build: the room's mesh, built in a worker on entering, takes longer.","The walk surface changes, so the walking checks and the lantern spots need checking again."],"effort":"About 3 to 4 days of code.","source":"claude","assumptions":["Forms of 20 cm and up read at the current 12 cm cell, and the triplanar texture carries everything finer.","The worker build stays short enough on entering (time it before and after; the room now builds in the zone's fade)."],"risks":["Terraced and ridged shapes under the mesher can make stair-steps and slivers. Smoothing them back with soft blends brings the softness back, so the blend widths need tuning.","The baked lantern sight must be rebaked on the new shape, and walking must still clear the new ledges."],"estimates":[{"what":"Code","value":"3 to 4 days","basis":"field forms: terraces, rock layer, joints (1.5 days); triplanar scan port (1 day); rubble as lit stones, no outline (half a day); retune and walk checks (half a day)"},{"what":"Room build time","value":"about 3 to 10 times today's","basis":"each field sample gets several more noise and Voronoi evaluations at the same grid size"},{"what":"Triangles","value":"about the same as today","basis":"the mesh size stays 12 cm"}]},{"key":"C","name":"A sculpted interior from you","summary":"You sculpt the room's inside as one model, with its normal and occlusion baked, and export it as a glb, as you did for the cave mouth's outside. The game draws your model with the cliffs' rock texture, and keeps the field only for walking and the lantern's light.","sketch":"\u003csvg viewBox='0 0 320 180' xmlns='http://www.w3.org/2000/svg'>\u003crect x='0' y='0' width='320' height='180' fill='none'/>\u003cpolygon points='20,40 70,22 96,48 140,36 170,58 214,30 250,62 300,52 300,150 20,150' fill='var(--accent)' opacity='0.45'/>\u003cpolyline points='20,40 70,22 96,48 140,36 170,58 214,30 250,62 300,52' fill='none' stroke='currentColor' stroke-width='3'/>\u003cpath d='M20 52 C 80 44, 120 60, 170 62 S 260 60, 300 64' fill='none' stroke='currentColor' stroke-width='2' stroke-dasharray='6 5'/>\u003ctext x='20' y='172' font-size='13' fill='currentColor'>your sculpted model\u003c/text>\u003ctext x='170' y='88' font-size='13' fill='currentColor'>field: walking only\u003c/text>\u003c/svg>","pros":["The best look: real sculpted stone, with crisp edges and baked detail exactly where you want it.","Your eye sets the room, as with the cave mouth's outside.","One small room costs little to draw: about 20,000 to 40,000 triangles."],"cons":["Your time: a sculpt, a decimate, UVs and a bake before any code.","Walking and the model can drift apart: feet float or sink where the model leaves the field by more than 5 to 10 cm.","It does not carry to the Hollow's rooms, which are procedural, so their rock still needs the field route later."],"effort":"About 8 to 16 hours of your time, plus 1 to 1.5 days of code.","source":"claude","assumptions":["You want to make it, and the room's layout (the arch, the rubble passage, the hook, the pool) stays where the code puts it.","The model can be fitted to within 5 to 10 cm of the walking field, or walking switches to the model's own surface."],"risks":["The baked occlusion fights the physically computed light if used as colour. It has to be occlusion only.","Any later change to the room's layout means a new sculpt."],"estimates":[{"what":"Your time","value":"8 to 16 hours","basis":"sculpt, decimate or retopo, UVs, normal and occlusion bake, glb export"},{"what":"Code","value":"1 to 1.5 days","basis":"load the glb into the cave pass, sample its maps, align to the field, check walking"},{"what":"Memory","value":"about 10 to 20 MB","basis":"20,000 to 40,000 triangles and 2k normal and occlusion maps"}]}],"criteria":[{"name":"Reads as stone","scores":{"A":1,"B":2,"C":3},"note":"A leaves the soft shapes; B gives ledges and slabs; C gives crisp sculpted stone"},{"name":"Matches the cliff outside","scores":{"A":3,"B":3,"C":3},"note":"all three use the cliffs' rock texture"},{"name":"Your time","scores":{"A":3,"B":3,"C":1}},{"name":"Code effort","scores":{"A":3,"B":2,"C":2}},{"name":"Carries to the spring cave and the Hollow","scores":{"A":2,"B":3,"C":1},"note":"the field and shader are shared; a sculpt is for this room only"}],"evidence":[{"claim":"Bump and normal detail never change silhouettes or shadows; only real geometry does.","options":["A","B"],"source":"Bump mapping (Wikipedia)","url":"https://en.wikipedia.org/wiki/Bump_mapping"},{"claim":"Triplanar mapping blends three axis projections by the normal, about three texture reads per map, and needs no stored tangents.","options":["A","B","C"],"source":"GPU Gems 3, ch. 1: Generating Complex Procedural Terrains Using the GPU","url":"https://developer.nvidia.com/gpugems/gpugems3/part-i-geometry/chapter-1-generating-complex-procedural-terrains-using-gpu"},{"claim":"Stacking octaves of hashed rock-like spheres with smooth max and min gives faceted boulder detail while the field stays a true distance, unlike adding plain noise.","options":["B"],"source":"Inigo Quilez, FBM detail in SDFs","url":"https://iquilezles.org/articles/fbmsdf/"},{"claim":"A terrace curve keeps most of each step flat and rises steeply between them: the shape of bedding ledges and floor slabs.","options":["B"],"source":"noise crate, Terrace modifier source","url":"https://docs.rs/crate/noise/0.8.1/source/src/noise_fns/modifiers/terrace.rs"},{"claim":"Even-width crack lines come from a corrected Voronoi edge distance, suited to rock joints.","options":["B"],"source":"Inigo Quilez, voronoi edges","url":"https://iquilezles.org/articles/voronoilines/"},{"claim":"Deep Rock Galactic carves rooms from simple shapes and roughens them with a different noise per biome (sharp ridges in one, eroded walls in another).","options":["B"],"source":"Below Decks at Ghost Ship: Cave Generation in Deep Rock Galactic (community repost)","url":"https://devtrackers.gg/deep-rock-galactic/p/8cd5ca9c-below-decks-at-ghost-ship-cave-generation-in-deep-rock-galactic"},{"claim":"Organic caves built from modelled pieces still need free pieces on top and lighting to hide joins; seams and repeated detail are the main risks.","options":["C"],"source":"Skyrim's Modular Approach to Level Design (GDC 2013 write-up)","url":"https://www.gamedeveloper.com/design/skyrim-s-modular-approach-to-level-design"},{"claim":"Baking normal and occlusion maps from a high sculpt onto a low mesh is built into Blender.","options":["C"],"source":"Render Baking, Blender Manual","url":"https://docs.blender.org/manual/en/latest/render/cycles/baking.html"},{"claim":"The cliffs' photographed rock already exists as a texture array and is sampled triplanar in piece-draw.wgsl, scaled by its mean so the palette still sets the colour; the cave pass binds no textures today and could take the same maps.","options":["A","B","C"],"judgment":true},{"claim":"The smoke read comes mostly from the field: two soft noise octaves on the walls (0.9 and 3.6 cycles a metre), one on the floor, and rubble as faceted balls with outlines and no shadow.","options":["A","B"],"judgment":true}],"recommended":"B","recommendation":"Only real shape changes the smoke read, and B fixes the walls, the floor and the rubble at their cause with no art time from you. The work also carries to the spring cave and the Hollow.","confidence":"lean","change_mind":"If you would rather sculpt this one room yourself and want it crisper than procedural shapes give at a 12 cm mesh, C wins. If the richer field makes entering the room slow (more than about a second of build), B shrinks back toward A plus a lighter set of forms.","chosen":"B","reason":null,"decided_on":"2026-11-02","superseded_by":null,"challenge":null,"settles":[{"key":"procedural cave rock look","value":"stone forms (terraced ledges, rock-sphere detail layer, Voronoi joints) in the signed distance field at mesh scale; the photographed rock scan, triplanar and scaled by its mean, for fine grain"}],"brief":{"files":[{"path":"src/world/spring/cave-field.js","change":"add shared stone-form helpers: a terrace curve for bedding ledges and floor slabs, a stacked rock-sphere detail layer joined with smooth max and min (stays a true distance), Voronoi edge grooves for joints; floorAt gets slabs and sand pockets in place of the one smooth octave"},{"path":"src/world/stack/mouth-field.js","change":"mouthShape uses the new forms for the chamber, ceiling and passages; numbers from the recipe; rebake the lantern sight and occlusion on the new shape"},{"path":"src/render/passes/cave.js","change":"bind the ground-detail texture arrays (views a and b) and their sampler in the rock layout, as the pieces pass does"},{"path":"src/shaders/cave-draw.wgsl","change":"port scanRead from piece-draw.wgsl: triplanar cliff layer on the sides and rock layer on top, albedo scaled by the scan mean, normal blended; keep the sin-noise bump only as a faint extra; things get the scan too"},{"path":"src/world/stack/mouth.js","change":"rubble as real stones: lumped stones with their own normals, given the baked lantern sight and occlusion, written as rock (normal group 0) so they lose the outline"},{"path":"recipes/world/stack-mouth.json","change":"every new number: terrace step and sharpness, rock layer octaves and size, joint spacing and depth, slab size, scan tile and strength"},{"path":"tools/unit-tests-stack.js","change":"tests: the field stays a usable distance (gradient near 1), the floor has flat slabs within a tolerance, rubble vertices carry sight and occlusion, mesh build time within budget"}],"steps":["Time the current mouth mesh build in the worker and note its triangle count (the baseline).","Add the stone-form helpers in cave-field.js and switch the mouth room's walls, ceiling and floor to them, at the same 12 cm cell.","Rebake the lantern sight and occlusion; check walking clears the new ledges and the lantern spots, hook and note still sit right.","Bind the rock scan in the cave pass and port the triplanar read into cave-draw.wgsl.","Rebuild the rubble as lit, outline-free stones with the scan.","Tune in the game with screenshots at day and at night with the lantern hung (?stack=mouth, ?stack=lamp&hour=22); send them to Matt before handing over.","Leave the spring cave's look as it is unless the shared helpers change it; if they do, check its screenshots too."],"done_when":["Side by side with today's shots, the walls show ledges and edges, the floor shows slabs and sand pockets, the rubble reads as stones with shadows and no outline.","The rock up close matches the cliff texture outside the cave mouth.","Entering the room stays within the zone's fade (mesh build under about one second).","Typecheck at 0, affected tests pass, determinism unchanged (the room is live only)."],"validation":["node tools/run-tests.mjs --affected and node tools/typecheck.mjs.","Screenshots in the game at the same camera spots as stack-cave-shots-2026-11-02, checked by Claude before they reach Matt.","Build time logged before and after."],"avoid":["Plain noise added onto the distance field (breaks distances and the baked soft shadows); use the rock-sphere layer.","Smooth blends so wide they round the ledges back into blobs.","Painting colour into the rock to fake the style; the palette stays at the tonemap.","Shrinking the mesh cell or switching mesher; that was left out of this option.","Changing the room's layout (arch, rubble passage, hook, pool) or the walking rules."]},"_file":"0001-stack-cave-rock-look.html","_links":{"1":"0001-stack-cave-rock-look.html"}}</script>

  minus:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  back:'<svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  copy:'<svg class="icon" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  link:'<svg class="icon" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  alert:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
  dot:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>',
  book:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 4h9a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M5 16a4 4 0 0 1 4-4h9"/></svg>',
  brain:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 5a3 3 0 0 0-6 1 3 3 0 0 0-1 5 3 3 0 0 0 2 5 3 3 0 0 0 5 2z"/><path d="M12 5a3 3 0 0 1 6 1 3 3 0 0 1 1 5 3 3 0 0 1-2 5 3 3 0 0 1-5 2"/></svg>',
  edit:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  clock:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>'
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(4, '0');
const conf = {strong:'Strong recommendation', lean:'Leaning', 'toss-up':'Toss-up'};
document.title = `${pad(D.id)} ${D.title} · Crux`;
const opts = D.options || [];
const decided = D.status === 'decided' && D.chosen;

function refLinks(list){
  return (list || []).map(n => `<a href="${esc(fileOf(n))}">${pad(n)}</a>`).join(', ');
}
function fileOf(n){ return (D._links || {})[n] || 'index.html'; }

let h = `<div class="row" style="justify-content:space-between"><a class="brand" href="index.html"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="var(--muted)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 44V27M24 27L10 12M24 27V9"/><circle cx="10" cy="10" r="3"/><circle cx="24" cy="6" r="3"/></g><path d="M24 27L38 12" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round"/><circle cx="39" cy="10" r="4.5" fill="var(--accent)"/><circle cx="24" cy="27" r="3" fill="var(--accent)"/></svg><b>Crux</b></a><a class="row muted" href="index.html" style="gap:4px;text-decoration:none;font-size:14px">${I.back}All decisions</a></div>`;
h += `<div class="row" style="margin-top:14px"><span class="muted">${pad(D.id)}</span><span class="chip ${esc(D.status)}">${esc(D.status)}</span><span class="chip">${I.clock}${esc(D.date)}</span>${(D.lenses||[]).map(l=>`<span class="chip">${esc(l)}</span>`).join('')}${D.deep?'<span class="chip deep-chip">deep</span>':''}</div>`;
h += `<h1>${esc(D.title)}</h1><p>${esc(D.context)}</p>`;
if ((D.depends_on||[]).length) h += `<p class="muted row" style="gap:6px">${I.link}Builds on ${refLinks(D.depends_on)}</p>`;
if ((D.conflicts||[]).length) h += `<div class="callout bad"><b>Conflicts with active decision ${refLinks(D.conflicts)}.</b> Picking against it means superseding that decision.</div>`;
if (D.deliberate || D.holding_up || D.open_item){
  const dl = {yes:'Deliberate', likely:'Likely deliberate', unclear:'Unclear, may be accidental'}[D.deliberate] || '';
  h += `<div class="reads">
    ${D.open_item?`<div class="read bad-read">${I.alert}<div><b>Open item in the repo's own log.</b> Confirming this finding closes it.</div></div>`:''}
    ${dl?`<div class="read">${I.check}<div><b>${esc(dl)}</b></div></div>`:''}
    ${D.holding_up?`<div class="read ${D.holding_up==='strained'?'warn-read':'ok-read'}">${D.holding_up==='strained'?I.alert:I.check}<div><b>${D.holding_up==='strained'?'Strained':'Holding up'}</b>${D.strain?`<div>${esc(D.strain)}</div>`:''}</div></div>`:''}
  </div>`;
}
if (D.status === 'parked'){
  const rv = D.revisit || {}; const due = rv.date && rv.date <= new Date().toISOString().slice(0,10);
  h += `<div class="read ${due?'warn-read':''}" style="margin:4px 0 12px">${I.clock}<div><b>${due?'Parked, revisit is due':'Parked'}</b><div>${rv.date?`Come back on ${esc(rv.date)}`:''}${rv.date&&rv.trigger?', or ':''}${rv.trigger?`Come back ${esc(rv.trigger)}`:''}</div></div></div>`;
}
if ((D.log_refs||[]).length) h += `<p class="muted row" style="gap:6px">${I.book}Also in the repo's log: ${D.log_refs.map(r=>`<span class="code">${esc(r.file)}</span> ${esc(r.entry||'')}`).join(', ')}</p>`;
if (D.status === 'superseded' && D.superseded_by) h += `<div class="callout bad">Replaced by decision ${refLinks([D.superseded_by])}.</div>`;

h += `<h2>Options</h2><div class="options">`;
for (const o of opts){
  const rec = o.key === D.recommended, ch = decided && o.key === D.chosen;
  h += `<article class="card opt${rec?' is-rec':''}${ch?' is-chosen':''}${decided&&!ch?' is-dim':''}" id="opt-${esc(o.key)}">
    <div class="row"><span class="letter">${esc(o.key)}</span><h3 style="flex:1;min-width:0">${esc(o.name)}</h3></div>
    ${(rec||ch||o.source==='human')?`<div class="row">${rec?`<span class="badge rec">${I.star}${(D.status==='found'||D.deliberate)?'In the code now':'Recommended'}</span>`:''}${ch?`<span class="badge ch">${I.check}Chosen</span>`:''}${o.source==='human'?'<span class="chip">Your option</span>':''}</div>`:''}
    ${o.sketch?`<div class="sketch">${o.sketch}</div>`:''}
    <p style="margin:0">${esc(o.summary)}</p>
    <ul class="pc">${(o.pros||[]).map(p=>`<li class="pro">${I.plus}<span>${esc(p)}</span></li>`).join('')}${(o.cons||[]).map(c=>`<li class="con">${I.minus}<span>${esc(c)}</span></li>`).join('')}</ul>
    ${o.effort?`<p class="note" style="margin:0">Effort: ${esc(o.effort)}</p>`:''}
    ${(o.assumptions||[]).length?`<div class="sub">Assumes</div><ul class="mini">${o.assumptions.map(a=>`<li>${I.dot}<span>${esc(a)}</span></li>`).join('')}</ul>`:''}
    ${(o.risks||[]).length?`<div class="sub">Risks</div><ul class="mini risk">${o.risks.map(r=>`<li>${I.alert}<span>${esc(r)}</span></li>`).join('')}</ul>`:''}
    ${(o.estimates||[]).length?`<div class="sub">Estimates</div><div class="est">${o.estimates.map(e=>`<div><b>${esc(e.what)}:</b> ${esc(e.value)}${e.basis?`<div class="basis">Basis: ${esc(e.basis)}</div>`:''}</div>`).join('')}</div>`:''}
  </article>`;
}
h += `</div>`;
if ((D.ruled_out||[]).length) h += `<div class="ruled"><div class="sub">Ruled out</div><ul class="mini">${D.ruled_out.map(r=>`<li>${I.minus}<span>${esc(r.option)} <span class="muted">· ${esc(r.by)}</span></span></li>`).join('')}</ul></div>`;

if ((D.criteria||[]).length){
  h += `<h2>How they compare</h2><div class="card crit">`;
  for (const c of D.criteria){
    h += `<div class="crit-row"><div class="crit-name">${esc(c.name)}</div><div class="crit-opts">`;
    for (const o of opts){
      const s = (c.scores||{})[o.key];
      if (s == null) continue;
      h += `<span class="score${decided&&o.key===D.chosen?' is-chosen':''}"><span class="letter" style="width:22px;height:22px;font-size:12px">${esc(o.key)}</span><span class="pips">${[1,2,3].map(i=>`<span class="pip${i<=s?' on':''}"></span>`).join('')}</span></span>`;
    }
    h += `</div>${c.note?`<div class="note">${esc(c.note)}</div>`:''}</div>`;
  }
  h += `</div>`;
}

if ((D.evidence||[]).length){
  h += `<h2>Evidence</h2><div class="card ev">${D.evidence.map(e=>`<div class="ev-item"><div>${esc(e.claim)}</div><div class="ev-meta">${(e.options||[]).map(k=>`<span class="letter" style="width:20px;height:20px;font-size:11px">${esc(k)}</span>`).join('')}${e.judgment||!e.url?`<span class="chip">${I.brain}Claude's judgment</span>`:`<a href="${esc(e.url)}" target="_blank" rel="noopener">${I.book}${esc(e.source||e.url)}</a>`}</div></div>`).join('')}</div>`;
}

if (D.recommended){
  const ro = opts.find(o=>o.key===D.recommended);
  const isFinding = D.status === 'found' || D.deliberate;
  h += `<h2>${isFinding?'Evidence in the code':"Claude's recommendation"}</h2><div class="callout"><b>${esc(D.recommended)}${ro?': '+esc(ro.name):''}</b>${!isFinding && D.confidence?` <span class="muted">· ${esc(conf[D.confidence]||D.confidence)}</span>`:''}<p style="margin:6px 0 0">${esc(D.recommendation)}</p>${D.change_mind?`<p style="margin:8px 0 0"><span class="muted">What would change this:</span> ${esc(D.change_mind)}</p>`:''}</div>`;
}

if (D.challenge) h += `<h2>The case against the pick</h2><div class="callout bad"><p style="margin:0">${esc(D.challenge)}</p></div>`;

if (decided){
  const co = opts.find(o=>o.key===D.chosen);
  h += `<h2>Your decision</h2><div class="callout good"><b>${esc(D.chosen)}${co?': '+esc(co.name):''}</b>${D.decided_on?` <span class="muted">· ${esc(D.decided_on)}</span>`:''}${D.reason?`<p style="margin:6px 0 0">${esc(D.reason)}</p>`:''}</div>`;
  const B = D.brief;
  if (B){
    const list = (t, arr, ordered) => (arr||[]).length ? `<div><div class="sub">${t}</div>${ordered?`<ol>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:`<ul class="mini">${arr.map(x=>`<li>${I.dot}<span>${esc(x)}</span></li>`).join('')}</ul>`}</div>` : '';
    h += `<h2>Build brief</h2><div class="card brief">
      ${(B.files||[]).length?`<div><div class="sub">Files</div><ul class="mini">${B.files.map(f=>`<li>${I.dot}<span><span class="code">${esc(f.path)}</span> ${esc(f.change)}</span></li>`).join('')}</ul></div>`:''}
      ${list('Steps', B.steps, true)}${list('Done when', B.done_when)}${list('Validation', B.validation)}${list('Avoid', B.avoid)}
    </div>`;
  }
} else if (D.status === 'rejected'){
  h += `<h2>Dropped</h2><div class="callout bad">${D.reason?`<p style="margin:0">${esc(D.reason)}</p>`:'<p style="margin:0" class="muted">No reason given.</p>'}</div>`;
} else if (D.status === 'found'){
  h += `<h2>Review this finding</h2><div class="card">
    <div class="pick-opts" role="group" aria-label="Review">
      <button class="btn" data-act="confirm" aria-pressed="false">${I.check}Confirm</button>
      <button class="btn" data-act="reject" aria-pressed="false">${I.minus}Reject</button>
      <button class="btn" data-act="edit" aria-pressed="false">${I.edit}Edit</button>
    </div>
    <label class="note" for="why" id="whyLabel">Note (optional)</label>
    <textarea id="why" rows="2" placeholder="Anything to add, such as why it was done this way"></textarea>
    <div class="err" id="err"></div>
    <div class="row" style="margin-top:4px"><button class="btn primary" id="copyReview">${I.copy}Copy for Claude</button></div>
    <div class="toast" id="toast"></div>
    <p class="note" style="margin:6px 0 0">Paste the copied line into Claude, or reply there with several at once, such as "confirm 3, 5; reject 4".</p>
  </div>`;
} else if (D.status === 'open'){
  h += `<h2>Make the call</h2><div class="card">
    <div class="pick-opts" role="group" aria-label="Options">${opts.map(o=>`<button class="btn" data-k="${esc(o.key)}" aria-pressed="false">${esc(o.key)}: ${esc(o.name)}</button>`).join('')}</div>
    <div class="pick-opts" role="group" aria-label="Or set it aside" style="margin-top:-4px"><span class="note" style="align-self:center">Or</span><button class="btn" data-k="park" aria-pressed="false">${I.clock}Park it</button><button class="btn" data-k="drop" aria-pressed="false">${I.minus}Drop it</button></div>
    <label class="note" for="why" id="pickLabel">Your reason (optional)</label>
    <textarea id="why" rows="2" placeholder="Why this one, in a sentence"></textarea>
    <div class="err" id="err"></div>
    <div class="row" style="margin-top:4px"><button class="btn primary" id="copy">${I.copy}Copy pick for Claude</button></div>
    <div class="toast" id="toast"></div>
    <p class="note" style="margin:6px 0 0">Paste the copied line into Claude, or just type the letter there.</p>
  </div>`;
}
document.getElementById('app').innerHTML = h;

let pick = null;
document.querySelectorAll('.pick-opts .btn').forEach(b => b.addEventListener('click', () => {
  pick = b.dataset.k;
  document.querySelectorAll('.pick-opts .btn').forEach(x => x.setAttribute('aria-pressed', x === b));
  const pl = document.getElementById('pickLabel');
  if (pl) pl.textContent = pick === 'park' ? 'When to come back: a date or a trigger (required)' : pick === 'drop' ? 'Why not (optional)' : 'Your reason (optional)';
  document.getElementById('err').textContent = '';
}));
const copyBtn = document.getElementById('copy');
if (copyBtn) copyBtn.addEventListener('click', async () => {
  if (!pick){ document.getElementById('err').textContent = 'Choose an option first'; return; }
  const why = document.getElementById('why').value.trim();
  if (pick === 'park' && !why){ document.getElementById('err').textContent = 'Say when to come back to it'; return; }
  const line = pick === 'park' ? `Decision ${pad(D.id)}: park, revisit ${why}`
    : pick === 'drop' ? `Decision ${pad(D.id)}: drop.` + (why ? ` Reason: ${why}` : '')
    : `Decision ${pad(D.id)}: pick ${pick}.` + (why ? ` Reason: ${why}` : '');
  try { await navigator.clipboard.writeText(line); document.getElementById('toast').textContent = 'Copied. Paste it into Claude.'; }
  catch(e){ const t = document.getElementById('why'); t.value = line; t.select(); document.getElementById('toast').textContent = 'Copy was blocked; the line is selected in the box above.'; }
});
let act = null;
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
  act = b.dataset.act;
  document.querySelectorAll('[data-act]').forEach(x => x.setAttribute('aria-pressed', x === b));
  document.getElementById('whyLabel').textContent = act === 'edit' ? 'What should change (required)' : 'Note (optional)';
  document.getElementById('err').textContent = '';
}));
const rev = document.getElementById('copyReview');
if (rev) rev.addEventListener('click', async () => {
  const why = document.getElementById('why').value.trim();
  if (!act){ document.getElementById('err').textContent = 'Choose confirm, reject or edit first'; return; }
  if (act === 'edit' && !why){ document.getElementById('err').textContent = 'Say what should change'; return; }
  const line = `Decision ${pad(D.id)}: ${act}` + (why ? `: ${why}` : '.');
  try { await navigator.clipboard.writeText(line); document.getElementById('toast').textContent = 'Copied. Paste it into Claude.'; }
  catch(e){ const t = document.getElementById('why'); t.value = line; t.select(); document.getElementById('toast').textContent = 'Copy was blocked; the line is selected in the box above.'; }
});
document.getElementById('why')?.addEventListener('input', () => document.getElementById('err').textContent = '');
</script>
</body>
</html>
