<style>
:root{--bg:#0b0d11;--panel:#10141a;--lane:#12161c;--surface:#191e26;--surface2:#1e242d;--raised:#1b2029;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.12);--text:#e7eaf0;--muted:#a2aab7;--faint:#6c7584;--accent:#8ea8ff;--accent-ink:#0d1530;--accent-bg:rgba(142,168,255,.14);--good:#5fd3ae;--good-bg:rgba(95,211,174,.13);--warn:#f3b955;--warn-bg:rgba(243,185,85,.13);--bad:#f2727a;--bad-bg:rgba(242,114,122,.13);--chosen:#5fd3ae;--hist:#8792ad;--radius:10px;--font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace;--good-fill:#5fd3ae;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
main{max-width:1240px;margin:0 auto;padding:18px 18px 48px}
h1{font-size:21px;font-weight:600;margin:4px 0 8px;line-height:1.3}
h2{font-size:14px;font-weight:600;margin:26px 0 10px;color:var(--text);letter-spacing:.1px}
h3{font-size:14.5px;font-weight:600;margin:0}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.open{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.decided{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.found{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.superseded,.chip.rejected{text-decoration:line-through}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.btn{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer}
.btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.18)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
input,textarea{font:inherit;width:100%;max-width:100%;padding:8px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--faint)}
svg{max-width:100%}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:600;font-size:16px}
.brand .mark{width:24px;height:24px}
.brand .repo{color:var(--muted);font-weight:400}
.search{position:relative;flex:0 1 280px;min-width:180px}
.search .icon{position:absolute;left:10px;top:9px;color:var(--faint)}
.search input{padding-left:32px}
.sub{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 0 4px;font-size:12.5px;color:var(--muted)}
.sub .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.ptitle{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--lane);gap:2px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tile{display:grid;place-items:center;aspect-ratio:1.35;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text);font-family:var(--mono);font-size:12.5px;position:relative;border-top:3px solid var(--c)}
.tile:hover{background:var(--surface2)}
.tile small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--font);font-size:10.5px;color:var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.areas{display:grid;gap:8px}
.area{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.area .pips{display:flex;flex-wrap:wrap;gap:3px}
.area .pips a{width:16px;height:16px;border-radius:4px;background:var(--c);opacity:.85;display:block}
.area .pips a:hover{opacity:1;outline:1px solid var(--text)}
.area .n{color:var(--faint);font-size:12px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;align-items:start}
.lane{background:var(--lane);border:1px solid var(--line);border-radius:var(--radius);padding:10px;border-top:3px solid var(--c);min-width:0}
.lhead{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;padding:2px 2px 10px}
.lhead .icon{color:var(--c)}
.lhead .count{color:var(--faint);font-weight:400}
.lhint{font-size:12px;color:var(--faint);padding:0 2px 8px;margin-top:-6px}
.cards{display:grid;gap:8px}
.dcard{display:grid;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;text-decoration:none;color:var(--text)}
.dcard:hover{background:var(--surface2);border-color:var(--line2)}
.dcard .t{font-weight:500;font-size:13.5px;line-height:1.35}
.dcard .num{font-family:var(--mono);color:var(--faint);font-size:11.5px}
.dcard .line{font-size:12.5px;color:var(--muted);line-height:1.4}
.dcard .line.warn{color:var(--warn)}
.dcard .line.ok{color:var(--good)}
.dcard .chips{display:flex;flex-wrap:wrap;gap:4px}
.dcard .chip{font-size:11px;padding:0 7px}
.map svg{width:100%;height:auto;display:block}
.map a text{fill:var(--text)}
.map a:hover rect{stroke:var(--text)}
.empty{padding:30px;text-align:center;color:var(--faint)}

.more{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line2)}
.more:hover{color:var(--text);border-color:var(--muted)}
.more .chev{transform:rotate(90deg)}
.more.less .chev{transform:rotate(-90deg)}
.dcard .line{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>

<script id="data" type="application/json">[{"id":1,"slug":"stack-cave-rock-look","title":"How should the stack's mouth room get rock that reads as stone?","date":"2026-11-02","mode":"quick","deep":true,"lenses":["ui","architecture"],"status":"decided","context":"F19's mouth room was passed for now, with its polish left for later: the walls read as smoke, the floor as rolling dunes, and the rubble as flat outlined shapes. The cause is in the code. The walls get only two soft noise octaves and a faint shader bump, with no texture. The floor is one smooth noise octave. The rubble stones are faceted balls with flat colour and an outline, and they get no shadow or occlusion. The way this is fixed sets how the spring cave and the Hollow's rooms will look too, since they share the same field and shader.","depends_on":[],"conflicts":[],"options":[{"key":"A","name":"Detail in the shader only","summary":"Keep the room's shape as it is. Paint the cliffs' photographed rock onto it with triplanar mapping (albedo and normal), add a baked crease darkening and a wet sheen near the floor, and rebuild the rubble's shading.","pros":["The smallest change: no new mesh, no change to walking or to the baked lantern light.","The rock matches the cliff outside, since it uses the same photographed texture and the same palette scaling as the pieces pass.","Cheap at run time: about six texture reads a pixel for albedo and normal."],"cons":["The outlines stay blobby. Shader detail never changes silhouettes or shadows, and the smoke read comes mostly from the soft shapes.","The floor still rolls like dunes. A texture on a dune is a textured dune.","Triplanar blending can show smears on diagonal faces."],"effort":"About 2 to 3 days of code.","source":"claude","assumptions":["The cliffs' rock scan reads well up close at 1 to 3 m, as it does on the cave mouth's outside.","Crease darkening can be baked from the field into the vertex colour beside the lantern's baked sight."],"risks":["It looks better but still soft, and a second polish pass is needed later anyway.","Photo colour fights the palette rule unless it is scaled by the scan's mean, as the pieces pass already does."],"estimates":[{"what":"Code","value":"2 to 3 days","basis":"triplanar scan port from piece-draw.wgsl (1 day), baked creases (half a day), rubble shading and wet floor (1 day)"},{"what":"Frame cost","value":"about 6 extra texture reads a pixel","basis":"3 projections for albedo and 3 for normal"}]},{"key":"B","name":"Stone forms in the field, texture on top","summary":"Give the room's field stone shapes at the current mesh size: flat bedding ledges and floor slabs (terraced), faceted boulder bulges (a stacked-rocks layer that keeps the field a true distance), shallow joint grooves, and a rougher ceiling. Then add the cliffs' triplanar rock texture for the fine grain, and rebuild the rubble as real stones that take the lantern's shadow and the scan, with no outline.","pros":["Fixes all three problems at their cause: the walls get ledges and edges, the floor gets slabs and sand pockets, and the rubble becomes stones.","The rubble joins the lantern's light: it casts and takes shadow and loses the cartoon outline.","The same field helpers serve the spring cave and the Hollow's rooms later, so the work pays back.","No new art from you: it is all procedural, tuned through recipes/world/stack-mouth.json."],"cons":["Edges stay a little rounded at the 12 cm mesh size. Truly crisp cracks need a finer mesh or a different mesher, which this option does not include.","A richer field costs more to build: the room's mesh, built in a worker on entering, takes longer.","The walk surface changes, so the walking checks and the lantern spots need checking again."],"effort":"About 3 to 4 days of code.","source":"claude","assumptions":["Forms of 20 cm and up read at the current 12 cm cell, and the triplanar texture carries everything finer.","The worker build stays short enough on entering (time it before and after; the room now builds in the zone's fade)."],"risks":["Terraced and ridged shapes under the mesher can make stair-steps and slivers. Smoothing them back with soft blends brings the softness back, so the blend widths need tuning.","The baked lantern sight must be rebaked on the new shape, and walking must still clear the new ledges."],"estimates":[{"what":"Code","value":"3 to 4 days","basis":"field forms: terraces, rock layer, joints (1.5 days); triplanar scan port (1 day); rubble as lit stones, no outline (half a day); retune and walk checks (half a day)"},{"what":"Room build time","value":"about 3 to 10 times today's","basis":"each field sample gets several more noise and Voronoi evaluations at the same grid size"},{"what":"Triangles","value":"about the same as today","basis":"the mesh size stays 12 cm"}]},{"key":"C","name":"A sculpted interior from you","summary":"You sculpt the room's inside as one model, with its normal and occlusion baked, and export it as a glb, as you did for the cave mouth's outside. The game draws your model with the cliffs' rock texture, and keeps the field only for walking and the lantern's light.","pros":["The best look: real sculpted stone, with crisp edges and baked detail exactly where you want it.","Your eye sets the room, as with the cave mouth's outside.","One small room costs little to draw: about 20,000 to 40,000 triangles."],"cons":["Your time: a sculpt, a decimate, UVs and a bake before any code.","Walking and the model can drift apart: feet float or sink where the model leaves the field by more than 5 to 10 cm.","It does not carry to the Hollow's rooms, which are procedural, so their rock still needs the field route later."],"effort":"About 8 to 16 hours of your time, plus 1 to 1.5 days of code.","source":"claude","assumptions":["You want to make it, and the room's layout (the arch, the rubble passage, the hook, the pool) stays where the code puts it.","The model can be fitted to within 5 to 10 cm of the walking field, or walking switches to the model's own surface."],"risks":["The baked occlusion fights the physically computed light if used as colour. It has to be occlusion only.","Any later change to the room's layout means a new sculpt."],"estimates":[{"what":"Your time","value":"8 to 16 hours","basis":"sculpt, decimate or retopo, UVs, normal and occlusion bake, glb export"},{"what":"Code","value":"1 to 1.5 days","basis":"load the glb into the cave pass, sample its maps, align to the field, check walking"},{"what":"Memory","value":"about 10 to 20 MB","basis":"20,000 to 40,000 triangles and 2k normal and occlusion maps"}]}],"criteria":[{"name":"Reads as stone","scores":{"A":1,"B":2,"C":3},"note":"A leaves the soft shapes; B gives ledges and slabs; C gives crisp sculpted stone"},{"name":"Matches the cliff outside","scores":{"A":3,"B":3,"C":3},"note":"all three use the cliffs' rock texture"},{"name":"Your time","scores":{"A":3,"B":3,"C":1}},{"name":"Code effort","scores":{"A":3,"B":2,"C":2}},{"name":"Carries to the spring cave and the Hollow","scores":{"A":2,"B":3,"C":1},"note":"the field and shader are shared; a sculpt is for this room only"}],"evidence":[{"claim":"Bump and normal detail never change silhouettes or shadows; only real geometry does.","options":["A","B"],"source":"Bump mapping (Wikipedia)","url":"https://en.wikipedia.org/wiki/Bump_mapping"},{"claim":"Triplanar mapping blends three axis projections by the normal, about three texture reads per map, and needs no stored tangents.","options":["A","B","C"],"source":"GPU Gems 3, ch. 1: Generating Complex Procedural Terrains Using the GPU","url":"https://developer.nvidia.com/gpugems/gpugems3/part-i-geometry/chapter-1-generating-complex-procedural-terrains-using-gpu"},{"claim":"Stacking octaves of hashed rock-like spheres with smooth max and min gives faceted boulder detail while the field stays a true distance, unlike adding plain noise.","options":["B"],"source":"Inigo Quilez, FBM detail in SDFs","url":"https://iquilezles.org ,"recommended":"B","recommendation":"Only real shape changes the smoke read, and B fixes the walls, the floor and the rubble at their cause with no art time from you. The work also carries to the spring cave and the Hollow.","confidence":"lean","change_mind":"If you would rather sculpt this one room yourself and want it crisper than procedural shapes give at a 12 cm mesh, C wins. If the richer field makes entering the room slow (more than about a second of build), B shrinks back toward A plus a lighter set of forms.","chosen":"B","reason":null,"decided_on":"2026-11-02","superseded_by":null,"challenge":null,"settles":[{"key":"procedural cave rock look","value":"stone forms (terraced ledges, rock-sphere detail layer, Voronoi joints) in the signed distance field at mesh scale; the photographed rock scan, triplanar and scaled by its mean, for fine grain"}],"brief":{"files":[{"path":"src/world/spring/cave-field.js","change":"add shared stone-form helpers: a terrace curve for bedding ledges and floor slabs, a stacked rock-sphere detail layer joined with smooth max and min (stays a true distance), Voronoi edge grooves for joints; floorAt gets slabs and sand pockets in place of the one smooth octave"},{"path":"src/world/stack/mouth-field.js","change":"mouthShape uses the new forms for the chamber, ceiling and passages; numbers from the recipe; rebake the lantern sight and occlusion on the new shape"},{"path":"src/render/passes/cave.js","change":"bind the ground-detail texture arrays (views a and b) and their sampler in the rock layout, as the pieces pass does"},{"path":"src/shaders/cave-draw.wgsl","change":"port scanRead from piece-draw.wgsl: triplanar cliff layer on the sides and rock layer on top, albedo scaled by the scan mean, normal blended; keep the sin-noise bump only as a faint extra; things get the scan too"},{"path":"src/world/stack/mouth.js","change":"rubble as real stones: lumped stones with their own normals, given the baked lantern sight and occlusion, written as rock (normal group 0) so they lose the outline"},{"path":"recipes/world/stack-mouth.json","change":"every new number: terrace step and sharpness, rock layer octaves and size, joint spacing and depth, slab size, scan tile and strength"},{"path":"tools/unit-tests-stack.js","change":"tests: the field stays a usable distance (gradient near 1), the floor has flat slabs within a tolerance, rubble vertices carry sight and occlusion, mesh build time within budget"}],"steps":["Time the current mouth mesh build in the worker and note its triangle count (the baseline).","Add the stone-form helpers in cave-field.js and switch the mouth room's walls, ceiling and floor to them, at the same 12 cm cell.","Rebake the lantern sight and occlusion; check walking clears the new ledges and the lantern spots, hook and note still sit right.","Bind the rock scan in the cave pass and port the triplanar read into cave-draw.wgsl.","Rebuild the rubble as lit, outline-free stones with the scan.","Tune in the game with screenshots at day and at night with the lantern hung (?stack=mouth, ?stack=lamp&hour=22); send them to Matt before handing over.","Leave the spring cave's look as it is unless the shared helpers change it; if they do, check its screenshots too."],"done_when":["Side by side with today's shots, the walls show ledges and edges, the floor shows slabs and sand pockets, the rubble reads as stones with shadows and no outline.","The rock up close matches the cliff texture outside the cave mouth.","Entering the room stays within the zone's fade (mesh build under about one second).","Typecheck at 0, affected tests pass, determinism unchanged (the room is live only)."],"validation":["node tools/run-tests.mjs --affected and node tools/typecheck.mjs.","Screenshots in the game at the same camera spots as stack-cave-shots-2026-11-02, checked by Claude before they reach Matt.","Build time logged before and after."],"avoid":["Plain noise added onto the distance field (breaks distances and the   { k:'openitem', name:'Open item', hint:'Flagged for review in the repo’s own log', c:'var(--bad)', icon:I.flag, test:d => d.open_item && (d.status==='found'||d.status==='open') },
  { k:'strained', name:'Strained', hint:'Deliberate, but now causing cost or risk', c:'var(--warn)', icon:I.alert, test:d => d.holding_up==='strained' && d.status!=='superseded' && d.status!=='rejected' },
  { k:'open', name:'Needs your call', hint:'Open decisions waiting for a pick', c:'var(--accent)', icon:I.split, test:d => d.status==='open' || (d.status==='parked' && due(d)) },
  { k:'review', name:'Needs review', hint:'Found in the code, waiting to be confirmed', c:'#b49cff', icon:I.eye, test:d => d.status==='found' },
  { k:'parked', name:'Parked', hint:'Set aside until a date or a trigger', c:'#7f8aa3', icon:I.clock, test:d => d.status==='parked' },
  { k:'decided', name:'Decided', hint:'Confirmed or picked', c:'var(--good)', icon:I.check, test:d => d.status==='decided' },
  { k:'history', name:'History', hint:'Superseded or rejected', c:'var(--hist)', icon:I.archive, test:d => d.status==='superseded' || d.status==='rejected' }
];
const today = new Date().toISOString().slice(0,10);
function due(d){ return !!(d.revisit && d.revisit.date && d.revisit.date <= today); }
const stateOf = d => STATES.find(s => s.test(d)) || STATES[3];
ALL.forEach(d => d._s = stateOf(d));
const repoName = (location.pathname.split('/').slice(-3,-2)[0] || '');
document.getElementById('repo').textContent = repoName ? '· ' + decodeURIComponent(repoName) : '';

function sub(){
  const counts = STATES.map(s => [s, ALL.filter(d => d._s===s).length]).filter(([,n]) => n);
  document.getElementById('sub').innerHTML = `<span>${ALL.length} decision${ALL.length===1?'':'s'}</span>` + counts.map(([s,n]) => `<span><span class="dot" style="background:${s.c}"></span>${n} ${s.name.toLowerCase()}</span>`).join('');
}

function glance(list){
  const total = list.length || 1;
  const counts = STATES.map(s => [s, list.filter(d => d._s===s).length]).filter(([,n]) => n);
  const bar = `<div class="bar">${counts.map(([s,n]) => `<span style="width:${n/total*100}%;background:${s.c}" title="${n} ${esc(s.name)}"></span>`).join('')}</div>
    <div class="legend">${counts.map(([s,n]) => `<span><i style="background:${s.c}"></i>${n} ${esc(s.name.toLowerCase())}</span>`).join('')}</div>`;
  const tiles = `<div class="tiles">${[...list].sort((a,b)=>a.id-b.id).map(d => `<a class="tile" style="--c:${d._s.c}" href="${esc(d._file)}" title="${pad(d.id)} ${esc(d.title)} · ${esc(d._s.name)}">${pad(d.id).replace(/^0+(?=\d{2})/,'')}<small>${esc(shortTitle(d))}</small></a>`).join('')}</div>`;
  const lenses = [...new Set(list.flatMap(d => d.lenses||[]))].sort();
  const areas = `<div class="areas">${lenses.map(l => { const ds = list.filter(d => (d.lenses||[]).includes(l)).sort((a,b)=>STATES.indexOf(a._s)-STATES.indexOf(b._s)); return `<div class="area"><span>${esc(l)}</span><span class="pips">${ds.map(d => `<a style="--c:${d._s.c}" href="${esc(d._file)}" title="${pad(d.id)} ${esc(d.title)}"></a>`).join('')}</span><span class="n">${ds.length}</span></div>`; }).join('')}</div>`;
  return `<div class="glance">
    <div class="panel"><div class="ptitle">${I.bars}Where things stand</div>${bar}<div style="margin-top:14px">${tiles}</div></div>
    <div class="panel"><div class="ptitle">${I.layers}By area</div>${areas || '<div class="muted">No areas tagged</div>'}</div>
  </div>`;
}
function shortTitle(d){
  const o = (d.options||[]).find(x => x.key === (d.chosen || d.recommended));
  return (o ? o.name : d.title).split(/[;,:(]/)[0];
}

function card(d){
  const o = (d.options||[]).find(x => x.key === d.chosen);
  let line = '';
  if (d.holding_up==='strained' && d.strain) line = `<div class="line warn">${esc(d.strain)}</div>`;
  else if (d.status==='decided' && o) line = `<div class="line ok">${esc(d.chosen)}: ${esc(o.name)}${d.reason?` <span class="muted">· ${esc(d.reason)}</span>`:''}</div>`;
  else if (d.status==='superseded') line = `<div class="line">Replaced by ${pad(d.superseded_by)}</div>`;
  else if (d.status==='parked') { const rv = d.revisit||{}; line = `<div class="line${due(d)?' warn':''}">${due(d)?'Revisit due':'Back'} ${rv.date?esc(rv.date):''}${rv.date&&rv.trigger?' or ':''}${rv.trigger?esc(rv.trigger):''}</div>`; }
  else if (d.status==='rejected') line = `<div class="line">Dropped${d.reason?`: ${esc(d.reason)}`:''}</div>`;
  else { const r = (d.options||[]).find(x => x.key === d.recommended); if (r) line = `<div class="line">${d.status==='found'?'In the code':'Leaning'}: ${esc(r.name)}</div>`; }
  return `<a class="dcard" href="${esc(d._file)}"><div class="row" style="gap:6px"><span class="num">${pad(d.id)}</span>${d.open_item?`<span class="chip bad">open item</span>`:''}${d.status==='parked'&&due(d)?'<span class="chip found">revisit due</span>':''}${d.deep?'<span class="chip open">deep</span>':''}</div><div class="t">${esc(d.title)}</div>${line}<div class="chips">${(d.lenses||[]).map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div></a>`;
}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const CHEV = '<svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const laneKey = 'crux.repo.' + (repoName || 'repo') + '.openLanes';
let openLanes = new Set(store.get(laneKey) || []);
const CAP = { decided: 3, history: 3 };
function lanes(list, searching){
  const ls = STATES.map(s => [s, list.filter(d => d._s===s).sort((a,b)=>b.id-a.id)]).filter(([,ds]) => ds.length);
  return `<div class="lanes">${ls.map(([s,ds]) => {
    const cap = CAP[s.k] || 5;
    const all = searching || openLanes.has(s.k);
    const shown = all ? ds : ds.slice(0, cap);
    const more = ds.length - shown.length;
    return `<section class="lane" style="--c:${s.c}"><div class="lhead">${s.icon}${esc(s.name)} <span class="count">${ds.length}</span></div><div class="lhint">${esc(s.hint)}</div><div class="cards">${shown.map(card).join('')}</div>${more>0?`<button class="more" data-lane="${s.k}">${CHEV}Show ${more} more</button>`:(!searching && ds.length > cap ? `<button class="more less" data-lane="${s.k}">${CHEV}Show fewer</button>` : '')}</section>`;
  }).join('')}</div>`;
}
document.getElementById('out').addEventListener('click', e => {
  const lb = e.target.closest('[data-lane]');
  if (lb){ const k = lb.dataset.lane; openLanes.has(k) ? openLanes.delete(k) : openLanes.add(k); store.set(laneKey, [...openLanes]); render(); }
});

function depMap(all){
  let list = all;
  const ids = new Set(all.map(d => d.id));
  const byId = new Map(all.map(d => [d.id, d]));
  const deps = d => (d.depends_on||[]).filter(n => ids.has(n));
  const linked = new Set(list.flatMap(d => deps(d).length ? [d.id, ...deps(d)] : []));
  if (!linked.size) return '';
  const loose = list.filter(d => !linked.has(d.id)).length;
  list = list.filter(d => linked.has(d.id));
  const depth = new Map();
  const dep = (d, seen = new Set()) => { if (depth.has(d.id)) return depth.get(d.id); if (seen.has(d.id)) return 0; seen.add(d.id); const v = deps(d).length ? 1 + Math.max(...deps(d).map(n => dep(byId.get(n), seen))) : 0; depth.set(d.id, v); return v; };
  list.forEach(d => dep(d));
  const cols = Math.max(...depth.values()) + 1;
  const colItems = [];
  const rowOf = new Map();
  for (let c = 0; c < cols; c++) {
    const items = list.filter(d => depth.get(d.id) === c);
    const key = d => { const ps = deps(d).map(n => rowOf.get(n)).filter(v => v != null); return ps.length ? ps.reduce((a,b)=>a+b,0)/ps.length : d.id/1000; };
    items.sort((a,b) => key(a) - key(b) || a.id - b.id);
    items.forEach((d, i) => rowOf.set(d.id, i));
    colItems.push(items);
  }
  const W = 190, H = 46, GX = 70, GY = 14, PAD = 6;
  const rows = Math.max(...colItems.map(c => c.length));
  const pos = new Map();
  colItems.forEach((c, ci) => c.forEach((d, ri) => pos.set(d.id, { x: PAD + ci*(W+GX), y: PAD + ri*(H+GY) })));
  const vw = PAD*2 + cols*W + (cols-1)*GX, vh = PAD*2 + rows*H + (rows-1)*GY;
  let edges = '', nodes = '';
  for (const d of list) for (const n of deps(d)) {
    const a = pos.get(n), b = pos.get(d.id);
    const x1 = a.x+W, y1 = a.y+H/2, x2 = b.x, y2 = b.y+H/2;
    let path;
    if (b.x - a.x <= W + GX) { const mx = (x1+x2)/2; path = `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2-6} ${y2}`; }
    else {
      // Long edge: drop into the gap between rows so it never runs behind a box.
      const yg = b.y > PAD ? b.y - GY/2 : b.y + H + GY/2;
      const g1 = x1 + GX/2, g2 = x2 - GX/2;
      path = `M${x1} ${y1}C${g1} ${y1} ${x1} ${yg} ${g1} ${yg}L${g2} ${yg}C${x2} ${yg} ${g2} ${y2} ${x2-6} ${y2}`;
    }
    edges += `<path d="${path}" fill="none" stroke="var(--faint)" stroke-width="1.3" marker-end="url(#ah)"/>`;
  }
  for (const d of list) { const p = pos.get(d.id); const t = shortTitle(d); nodes += `<a href="${esc(d._file)}"><title>${pad(d.id)} ${esc(d.title)}</title><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8" fill="var(--surface)" stroke="var(--line2)"/><rect x="${p.x}" y="${p.y+8}" width="3" height="${H-16}" rx="1.5" fill="${d._s.c}"/><text x="${p.x+12}" y="${p.y+19}" font-size="11" font-family="var(--mono)" fill="var(--faint)">${pad(d.id)}</text><text x="${p.x+12}" y="${p.y+35}" font-size="12.5">${esc(t.length > 26 ? t.slice(0,25)+'…' : t)}</text></a>`; }
  return `<h2 class="row" style="gap:7px">${I.tree}What builds on what</h2><div class="panel map"><svg viewBox="0 0 ${vw} ${vh}" style="max-width:${vw}px" role="img" aria-label="Dependency map of decisions"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--faint)" stroke-width="1.5"/></marker></defs>${edges}${nodes}</svg><div class="legend" style="margin-top:8px">Left to right: foundations first. ${loose ? `${loose} decision${loose===1?' stands':'s stand'} on ${loose===1?'its':'their'} own and ${loose===1?'is':'are'} not shown here.` : ''}</div></div>`;
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = ALL.filter(d => !q || JSON.stringify([d.title,d.context,d.reason,d.strain,(d.lenses||[]),(d.options||[]).map(o=>o.name+' '+o.summary)]).toLowerCase().includes(q));
  if (!list.length){ document.getElementById('out').innerHTML = `<div class="empty">${ALL.length ? 'No matches' : 'No decisions yet'}</div>`; return; }
  document.getElementById('out').innerHTML = glance(list) + `<h2 class="row" style="gap:7px">${I.grid}Board</h2>` + lanes(list, !!q) + depMap(list);
}
sub();
document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
</html>
