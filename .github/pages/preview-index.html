<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebb previews</title>
<link rel="icon" href="../brand/ebb-favicon.svg" type="image/svg+xml">
<!-- The branch previews list (.github/workflows/pages.yml copies this to preview/index.html and
     writes preview/branches.json beside it). Newest first or A to Z (kept on this device), a search
     box, a "new" tag for the last day, times in the viewer's own clock, and branches already merged
     into main folded away at the bottom. -->
<style>
  @font-face { font-family: 'Nunito'; src: url('../src/vendor/fonts/nunito-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Nunito'; src: url('../src/vendor/fonts/nunito-latin-800-normal.woff2') format('woff2'); font-weight: 800; font-display: swap; }
  :root { color-scheme: light; --paper: #F4EEE4; --ink: #1E2624; --soft: #4A5551; --pencil: #8A8478; --rule: #DCCFBB; --moss: #5F7F5B; --link: #4a6a47; --new-wash: #E1ECD3; --new-ink: #42613A; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; background: var(--paper); color: var(--ink); font: 600 17px/1.5 Nunito, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 800; margin: 0 0 4px; line-height: 1.2; }
  p { margin: 0 0 18px; color: var(--soft); }
  p a { color: var(--link); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .chip { appearance: none; margin: 0; min-height: 44px; padding: 6px 16px; border: 1.5px solid var(--rule); border-radius: 999px; background: transparent; color: var(--soft); font: inherit; font-size: 16px; cursor: pointer; }
  .chip:hover { border-color: var(--soft); }
  .chip[aria-pressed='true'] { background: var(--moss); border-color: var(--moss); color: var(--paper); }
  .find { display: block; margin: 0 0 18px; }
  .find span { display: block; font-size: 16px; color: var(--soft); margin-bottom: 4px; }
  .find input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--rule); border-radius: 10px; background: #FBF7F0; color: var(--ink); font: inherit; font-size: 17px; }
  .find input:focus { outline: 2px solid var(--moss); outline-offset: 1px; }
  h2, summary { font-size: 16px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--moss); margin: 8px 0 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid #ddd3c4; }
  li a { display: block; padding: 12px 4px; color: inherit; text-decoration: none; border-radius: 8px; }
  li a:hover { background: rgba(95, 127, 91, 0.08); }
  li a:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  .name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 19px; color: var(--link); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; overflow-wrap: anywhere; }
  .name b { font-weight: 600; min-width: 0; }
  .new { font-size: 16px; font-weight: 800; padding: 0 10px; border-radius: 999px; background: var(--new-wash); color: var(--new-ink); text-decoration: none; }
  .when { display: block; font-size: 16px; color: var(--soft); }
  .empty { padding: 12px 4px; color: var(--pencil); font-size: 16px; }
  details { margin-top: 22px; }
  summary { cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 44px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  /* A drawn chevron (two borders), pointing down while folded, up when open. */
  summary::after { content: ''; width: 9px; height: 9px; margin-left: auto; margin-right: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-3px) rotate(45deg); }
  details[open] summary::after { transform: translateY(2px) rotate(-135deg); }
  details li a .name { color: var(--soft); }
  @media (pointer: coarse) { body { font-size: 17px; } .when, .empty, .find span { font-size: 16px; } }
</style>
</head>
<body>
<main>
  <h1>ebb branch previews</h1>
  <p>Each branch on GitHub, published for click-testing. The live game is <a href="../">here</a>.</p>
  <div class="tools" role="group" aria-label="Sort">
    <button type="button" class="chip" data-sort="new" aria-pressed="true">Newest first</button>
    <button type="button" class="chip" data-sort="az" aria-pressed="false">A to Z</button>
  </div>
  <label class="find"><span>Find a branch</span><input type="search" id="find" autocomplete="off" spellcheck="false"></label>
  <h2>In progress</h2>
  <ul id="live"><li class="empty">Loading the branches...</li></ul>
  <details id="merged-box">
    <summary>Merged into main</summary>
    <ul id="merged"></ul>
  </details>
</main>
<script>
(() => {
  const KEY = 'ebb.previews.sort';
  const DAY = 24 * 3600 * 1000;
  let sort = 'new';
  try { sort = localStorage.getItem(KEY) === 'az' ? 'az' : 'new'; } catch { /* storage blocked: newest first */ }
  /** @type {{ branch: string, slug: string, date: string, merged: boolean }[]} */
  let all = [];
  const rel = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  /** "12 minutes ago", "yesterday", "3 days ago", in the viewer's own clock. */
  function ago(t) {
    const s = (t - Date.now()) / 1000;
    const steps = [[60, 'second'], [3600, 'minute', 60], [DAY / 1000, 'hour', 3600], [7 * DAY / 1000, 'day', DAY / 1000], [Infinity, 'week', 7 * DAY / 1000]];
    for (const [under, unit, per] of steps) if (Math.abs(s) < under) return unit === 'second' ? 'just now' : rel.format(Math.round(s / per), unit);
    return '';
  }
  const local = (t) => new Date(t).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  function row(b) {
    const t = Date.parse(b.date);
    const fresh = !b.merged && Date.now() - t < DAY;
    return `<li><a href="${esc(b.slug)}/"><span class="name"><b>${esc(b.branch)}</b>${fresh ? '<span class="new">new</span>' : ''}</span>` +
      `<span class="when" title="${esc(local(t))}">updated ${esc(ago(t))}</span></a></li>`;
  }

  function render() {
    for (const c of document.querySelectorAll('[data-sort]')) c.setAttribute('aria-pressed', String(c.dataset.sort === sort));
    const q = document.getElementById('find').value.trim().toLowerCase();
    const shown = all.filter((b) => !q || b.branch.toLowerCase().includes(q));
    shown.sort(sort === 'az' ? (a, b) => a.branch.localeCompare(b.branch) : (a, b) => Date.parse(b.date) - Date.parse(a.date));
    const live = shown.filter((b) => !b.merged), merged = shown.filter((b) => b.merged);
    document.getElementById('live').innerHTML = live.length ? live.map(row).join('')
      : `<li class="empty">${q ? 'No branch in progress matches that.' : 'Nothing in progress right now.'}</li>`;
    document.getElementById('merged').innerHTML = merged.length ? merged.map(row).join('') : '<li class="empty">None.</li>';
    const box = document.getElementById('merged-box');
    box.hidden = !merged.length && !q;
    // A search that only finds merged branches opens the folded section.
    if (q && !live.length && merged.length) box.open = true;
  }

  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-sort]');
    if (!c) return;
    sort = c.dataset.sort;
    try { localStorage.setItem(KEY, sort); } catch { /* storage blocked: this visit only */ }
    render();
  });
  document.getElementById('find').addEventListener('input', render);
  fetch('branches.json', { cache: 'no-store' }).then((r) => r.json()).then((list) => { all = Array.isArray(list) ? list : []; render(); })
    .catch(() => { document.getElementById('live').innerHTML = '<li class="empty">The branch list did not load. Refresh to try again.</li>'; });
  // Keep "12 minutes ago" true while the page stays open.
  setInterval(() => { if (all.length) render(); }, 60000);
})();
</script>
</body>
</html>
