# Publishes the site to GitHub Pages:
#   main            -> https://mshomper.github.io/ebb/
#   other branches  -> https://mshomper.github.io/ebb/preview/<branch>/
#   preview list    -> https://mshomper.github.io/ebb/preview/  (.github/pages/preview-index.html,
#                      reading preview/branches.json written below)
# Needs repo Settings > Pages > Source set to "GitHub Actions".

name: Pages

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      - name: Assemble main and branch previews
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          site="$GITHUB_WORKSPACE/site"
          mkdir -p "$site/preview"

          write_build() { # dir branch
            local sha date
            sha=$(git rev-parse --short "origin/$2")
            date=$(git log -1 --format=%cI "origin/$2")
            printf '{"branch":"%s","commit":"%s","date":"%s"}\n' "$2" "$sha" "$date" > "$1/build.json"
          }

          git archive origin/main | tar -x -C "$site"
          write_build "$site" main

          # The list page reads preview/branches.json: each branch's name, folder, last commit time
          # (ISO, with its zone, so the page shows it in the viewer's own time) and whether it is
          # already merged into main (its tip is in main's history and is not main's tip itself, so a
          # branch just cut from main still counts as in progress).
          main_sha=$(git rev-parse origin/main)
          rows=""
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            [ "$ref" = "main" ] || [ "$ref" = "HEAD" ] && continue
            slug=$(echo "$ref" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
            dir="$site/preview/$slug"
            mkdir -p "$dir"
            git archive "origin/$ref" | tar -x -C "$dir"
            write_build "$dir" "$ref"
            date=$(git log -1 --format=%cI "origin/$ref")
            merged=false
            if [ "$(git rev-parse "origin/$ref")" != "$main_sha" ] && git merge-base --is-ancestor "origin/$ref" origin/main; then merged=true; fi
            name=$(echo "$ref" | tr -d '"\\')
            rows="$rows${rows:+,}{\"branch\":\"$name\",\"slug\":\"$slug\",\"date\":\"$date\",\"merged\":$merged}"
          done
          printf '[%s]\n' "$rows" > "$site/preview/branches.json"
          cp .github/pages/preview-index.html "$site/preview/index.html"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
