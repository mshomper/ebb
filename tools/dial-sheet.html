<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebb clock dial</title>
<link rel="icon" href="../brand/ebb-favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Nunito'; src: url('../src/vendor/fonts/nunito-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Nunito'; src: url('../src/vendor/fonts/nunito-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
  body { background: #F4EEE4; color: #1E2624; font: 600 17px/1.45 'Nunito', system-ui, sans-serif; padding: 24px 16px; overflow-wrap: anywhere; }
  main { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 28px; font-weight: 800; margin: 0; }
  h2 { font-size: 20px; font-weight: 800; margin: 8px 0 0; }
  p { margin: 0; color: #4A5551; }
  a { color: #4a6a47; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
  .dial { width: 112px; height: 112px; border-radius: 50%; background: #1E2624; color: #F4EEE4; padding: 6px; }
  .dial svg { width: 100%; height: 100%; display: block; }
  figcaption { font-size: 16px; }
  figcaption b { display: block; font-weight: 800; }
</style>
</head>
<body>
<main>
  <h1>ebb clock dial</h1>
  <p>The dial at the top left of the island, drawn large: through one summer day, then midday on the first, middle and last day of each season. Under each one is the line it says. <a href="./">All tools</a></p>
  <h2>Through a summer day</h2>
  <div class="grid" id="day"></div>
  <h2>Through the year</h2>
  <div class="grid" id="year"></div>
</main>
<script src="./boot-guard.js"></script>
<script type="module">
  import { read } from '../src/ui/clock-dial.js';
  import { loadRecipe } from '../src/core/recipes.js';
  import { tideParams } from '../src/world/tide.js';
  import { SECONDS_PER_HOUR, SECONDS_PER_DAY, SECONDS_PER_SEASON } from '../src/core/clock.js';

  const [hud, sky, water] = await Promise.all([loadRecipe('world/hud'), loadRecipe('world/sky'), loadRecipe('world/water')]);
  const sunOpts = { latitudeDeg: sky.orbit?.latitudeDeg, tiltDeg: sky.orbit?.tiltDeg };
  const tideP = tideParams(water.tide);

  /** @param {HTMLElement} box @param {number} t @param {string} label */
  function add(box, t, label) {
    const r = read(t, sunOpts, tideP, hud.dial);
    const fig = document.createElement('figure');
    fig.innerHTML = `<div class="dial"><svg viewBox="0 0 48 48" aria-hidden="true">${r.svg}</svg></div>`;
    const cap = document.createElement('figcaption');
    const b = document.createElement('b');
    b.textContent = label;
    cap.append(b, r.line);
    fig.appendChild(cap);
    box.appendChild(fig);
  }

  const summer = SECONDS_PER_SEASON + 3 * SECONDS_PER_DAY;
  for (const h of [1, 4, 5.5, 7, 10, 12, 15, 18, 19.5, 21, 23]) {
    add(document.getElementById('day'), summer + h * SECONDS_PER_HOUR, `${Math.floor(h)}:${h % 1 ? '30' : '00'}`);
  }
  const names = hud.dial.seasons;
  for (let s = 0; s < 4; s++) {
    for (const d of [0, 3, 6]) {
      add(document.getElementById('year'), s * SECONDS_PER_SEASON + d * SECONDS_PER_DAY + 12 * SECONDS_PER_HOUR, `${names[s]}, day ${d + 1}, noon`);
    }
  }
</script>
</body>
</html>
