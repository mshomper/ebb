<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebb rock lab</title>
<link rel="icon" href="../brand/ebb-favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Nunito'; src: url('../src/vendor/fonts/nunito-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Nunito'; src: url('../src/vendor/fonts/nunito-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
  body { background: #F4EEE4; color: #1E2624; font: 600 17px/1.45 'Nunito', system-ui, sans-serif; padding: 16px; overflow-wrap: anywhere; }
  main { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; }
  h2 { font-size: 20px; font-weight: 800; margin: 0; }
  p { margin: 0; }
  .muted { color: #4A5551; font-size: 16px; }
  .card { background: #FBF7F0; border: 1px solid #E3D9C9; border-radius: 14px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
  figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: #1E2624; }
  figcaption { font-size: 16px; color: #4A5551; }
  figcaption b { color: #1E2624; font-size: 18px; display: block; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 24px; align-items: end; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: #EFE7DA; border: 1px solid #E3D9C9; }
  .seg label { flex: 1 1 auto; display: flex; position: relative; min-width: 0; }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .seg span { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 44px; padding: 6px 14px; border-radius: 10px; font-weight: 800; cursor: pointer; }
  .seg input:checked + span { background: #5F7F5B; color: #F4EEE4; }
  .seg input:focus-visible + span { outline: 2px solid #5F7F5B; outline-offset: 2px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field .row { display: flex; justify-content: space-between; gap: 12px; }
  input[type=range] { width: 100%; min-width: 0; height: 40px; margin: 0; accent-color: #5F7F5B; cursor: pointer; }
  a { color: #4a6a47; }
</style>
</head>
<body>
<main>
  <h1>ebb rock lab</h1>
  <p class="muted">Painted rock on flat ground, three ways, from the same scan. A 14 by 10 m rock patch in grass, seen from a typical play camera. <a href="./">All tools</a></p>
  <div class="card">
    <div class="controls">
      <fieldset>
        <legend>Light</legend>
        <div class="seg">
          <label><input type="radio" name="light" value="day" checked><span>Day, low sun</span></label>
          <label><input type="radio" name="light" value="noon"><span>Noon</span></label>
          <label><input type="radio" name="light" value="night"><span>Night</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Camera</legend>
        <div class="seg">
          <label><input type="radio" name="cam" value="far" checked><span>Play view</span></label>
          <label><input type="radio" name="cam" value="near"><span>Close up</span></label>
        </div>
      </fieldset>
      <div class="field">
        <div class="row"><label for="az">Sun direction</label><output id="az-out" for="az">-</output></div>
        <input id="az" type="range" min="0" max="360" step="5" value="210">
      </div>
    </div>
    <p class="muted" id="status">Loading the rock scan</p>
  </div>
  <div class="panels" id="panels"></div>
</main>
<script src="./boot-guard.js"></script>
<script type="module" src="./rock-lab.js"></script>
</body>
</html>
