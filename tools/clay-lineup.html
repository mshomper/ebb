<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebb clay lineup</title>
<link rel="icon" href="../brand/ebb-favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Nunito'; src: url('../src/vendor/fonts/nunito-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Nunito'; src: url('../src/vendor/fonts/nunito-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
  body { background: #F4EEE4; color: #1E2624; font: 600 17px/1.45 'Nunito', system-ui, sans-serif; padding: 16px; overflow-wrap: anywhere; }
  main { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; }
  p { margin: 0; color: #4A5551; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #EDE6DA; overflow: hidden; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: 800 16px/1.2 'Nunito', system-ui, sans-serif; color: #FBF7F0; background: #4a6a47; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
  button[aria-pressed=true] { background: #23361F; }
  a { color: #4a6a47; }
</style>
</head>
<body>
<main>
  <h1>Clay lineup</h1>
  <p>Left to right: Matt's mortar and his clay pot, then the clay bowl and the clay cup made in code (tools/assets/made/pieces.mjs), at their real sizes, under the asset lab's light. Matt's two are drawn from their own colour maps. Drag to turn, scroll to come closer. <a href="./">All tools</a></p>
  <p id="sizes"></p>
  <div class="row"><button id="day" aria-pressed="true">Day</button><button id="dusk" aria-pressed="false">Dusk</button><button id="pause" aria-pressed="false">Pause</button><button id="front">Look at the front</button></div>
  <div class="stage"><canvas id="view" aria-label="The clay lineup"></canvas></div>
</main>
<script src="./boot-guard.js"></script>
<script type="importmap">{ "imports": {
  "wgpu-matrix": "../src/vendor/wgpu-matrix/wgpu-matrix.module.js" } }</script>
<script type="module" src="./clay-lineup.js"></script>
</body>
</html>
